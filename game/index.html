<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#13112b">
<title>モンファス! 〜モンスターフュージョン〜</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===== タイトル ===== -->
  <section id="screen-title" class="screen active">
    <div class="title-inner">
      <div class="title-logo">
        <span class="logo-main">モンファス!</span>
        <span class="logo-sub">〜モンスターフュージョン〜</span>
      </div>
      <canvas id="title-mon" class="pixel title-mon"></canvas>
      <div class="tap-start">▼ タップしてスタート ▼</div>
    </div>
  </section>

  <!-- ===== ホーム(牧場) ===== -->
  <section id="screen-home" class="screen">
    <header class="home-header">
      <span class="home-logo">モンファス!</span>
      <div class="header-btns">
        <button id="btn-sound" class="icon-btn" type="button">🔊</button>
        <button id="btn-reset" class="icon-btn" type="button">🗑</button>
      </div>
    </header>
    <div class="home-info" id="home-info"></div>
    <div id="monster-grid" class="monster-grid"></div>
    <nav class="action-bar">
      <button id="btn-explore" class="action-btn explore" type="button">
        <span class="action-icon">🥚</span>探索
      </button>
      <button id="btn-fusion" class="action-btn fusion" type="button">
        <span class="action-icon">🌀</span>合成
      </button>
      <button id="btn-battle" class="action-btn battle" type="button">
        <span class="action-icon">⚔️</span>バトル
      </button>
    </nav>
  </section>

  <!-- ===== 合成 ===== -->
  <section id="screen-fusion" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-back type="button">◀ もどる</button>
      <span class="sub-title">🌀 モンスター合成</span>
    </header>
    <div class="fusion-slots">
      <div class="fusion-slot" id="slot-a"><span class="slot-empty">素材①<br>を選択</span></div>
      <div class="fusion-plus">＋</div>
      <div class="fusion-slot" id="slot-b"><span class="slot-empty">素材②<br>を選択</span></div>
    </div>
    <p class="fusion-note">※ 合成すると素材のモンスターはいなくなります</p>
    <div id="fusion-list" class="monster-grid small"></div>
    <div class="fusion-footer">
      <button id="btn-do-fusion" class="big-btn rainbow" type="button" disabled>✨ 合成する!! ✨</button>
    </div>
  </section>

  <!-- ===== バトル ===== -->
  <section id="screen-battle" class="screen">
    <div class="battle-stage" id="battle-stage">
      <div class="combatant enemy">
        <div class="plate" id="enemy-plate"></div>
        <div class="sprite-wrap" id="enemy-wrap"><canvas id="enemy-canvas" class="pixel battle-sprite"></canvas></div>
      </div>
      <div class="combatant player">
        <div class="sprite-wrap" id="player-wrap"><canvas id="player-canvas" class="pixel battle-sprite back"></canvas></div>
        <div class="plate" id="player-plate"></div>
      </div>
    </div>
    <div class="battle-log" id="battle-log">バトル開始!</div>
    <div class="battle-cmds" id="battle-cmds"></div>
  </section>

</div>

<!-- エフェクト用レイヤー -->
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="overlay-root"></div>
<div id="modal-root"></div>

<script src="game.js"></script>
</body>
</html>
